<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collocation Flashcards · RU → EN</title>
<style>
  :root{
    --ink:#40342b;
    --paper:#fffdf7;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Comic Sans MS","Comic Neue","Chalkboard SE","Segoe Print","Marker Felt",cursive,sans-serif;
    color:var(--ink);
    background-color:#fdf4e3;
    background-image:radial-gradient(#f0dfbe 2.2px, transparent 2.2px), radial-gradient(#f6e8cf 2.2px, transparent 2.2px);
    background-size:34px 34px, 34px 34px;
    background-position:0 0, 17px 17px;
    min-height:100vh;
    padding:28px 20px 48px;
  }
  header{max-width:1080px;margin:0 auto 24px;text-align:center}
  h1{font-size:2rem;margin:0 0 6px;letter-spacing:.5px}
  h1 .emoji{display:inline-block;transform:rotate(-10deg)}
  .sub{margin:0 0 14px;font-size:1.02rem;color:#7c6a58}
  #flipAll{
    font:inherit;font-weight:700;font-size:1rem;
    background:#ffd65a;border:3px solid var(--ink);border-radius:999px;
    padding:9px 22px;cursor:pointer;color:var(--ink);
    box-shadow:0 4px 0 rgba(64,52,43,.25);
    transition:transform .12s, box-shadow .12s;
  }
  #flipAll:hover{transform:translateY(-1px);box-shadow:0 6px 0 rgba(64,52,43,.25)}
  #flipAll:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(64,52,43,.25)}
  main{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .card{height:332px;perspective:1100px;cursor:pointer;transform:rotate(var(--tilt,0deg));outline:none}
  .card:focus-visible .inner{box-shadow:0 0 0 4px #ffd65a}
  .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,.2,.2,1)}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:3px solid var(--ink);border-radius:22px;background:var(--paper);
    box-shadow:0 7px 0 rgba(64,52,43,.14);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:44px 16px 42px;text-align:center;
  }
  .face.back{transform:rotateY(180deg);background:var(--tint)}
  .icon{
    width:104px;height:104px;border-radius:50%;flex:none;
    background:rgba(255,255,255,.85);border:3px dashed rgba(64,52,43,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .icon svg{width:84px;height:84px;display:block}
  .txt{font-size:1.18rem;font-weight:700;line-height:1.32}
  .txt.small{font-size:.99rem}
  .lang{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    font-size:.72rem;font-weight:700;letter-spacing:2px;
    background:var(--ink);color:#fff8ec;border-radius:999px;padding:3px 13px;
  }
  .num{position:absolute;top:10px;left:14px;font-size:.85rem;font-weight:700;color:#b3a18c}
  footer{max-width:1080px;margin:26px auto 0;text-align:center;color:#a08c74;font-size:.9rem}
  @media (max-width:520px){
    .txt{font-size:1.05rem}
    .card{height:316px}
  }
</style>
</head>
<body>

  <h1><span class="emoji">🎴</span> Collocation Flashcards</h1>
  <p class="sub">Нажми на карточку, чтобы перевернуть · Click a card to see the English</p>
  <button id="flipAll" type="button">Перевернуть все · Flip all</button>
</header>
<main id="grid"></main>
<footer>14 cards · Russian on the front, English on the back · the same little doodle on both sides 🎨</footer>

const cards = [
  { ru: "покраснеть от смущения", en: "to blush (from embarrassment)", icon: "blush",   tint: "#ffe1e8" },
  { ru: "создать благоприятную обстановку для общения (растопить лед)", en: "to create a friendly atmosphere for communication (to break the ice)", icon: "ice", tint: "#d9f0ff", small: true },
  { ru: "убедиться", en: "to make sure · to be sure", icon: "sure",  tint: "#fff1c6" },
  { ru: "увлечься чем-либо", en: "to get into sth · to be absorbed in", icon: "hooked", tint: "#e6dcff" },
  { ru: "закончиться спором", en: "to end in a quarrel / argument", icon: "fight", tint: "#ffe3cd" },
  { ru: "извлекать пользу из чего-либо", en: "to benefit from · to take advantage of", icon: "benefit", tint: "#ddf2e1" },
  { ru: "представиться", en: "to introduce oneself", icon: "intro", tint: "#e9e4ff" },
  { ru: "приветствовать кого-либо", en: "to greet someone", icon: "greet", tint: "#fff0d2" },
  { ru: "быть известным чем-либо", en: "to be known for (sth)", icon: "famous", tint: "#ffedc2" },
  { ru: "обижаться", en: "to take offence (at someone)", icon: "offended", tint: "#e2edfb" },
  { ru: "проявиться", en: "to appear · to surface", icon: "surface", tint: "#fff8c9" },
  { ru: "чувствовать себя разочарованным", en: "to feel disappointed", icon: "balloon", tint: "#f2e4ff" },
  { ru: "винить кого-либо", en: "to blame someone", icon: "blame", tint: "#ffe2df" },
  { ru: "пожать плечами", en: "to shrug (one’s shoulders)", icon: "shrug", tint: "#ddf5ee" }
];

const grid = document.getElementById("grid");
cards.forEach((c, i) => {
  const el = document.createElement("div");
  el.className = "card";
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.setAttribute("aria-pressed", "false");
  el.setAttribute("aria-label", "Карточка " + (i + 1) + ": " + c.ru + " — нажми, чтобы увидеть перевод");
  el.style.setProperty("--tilt", (((i * 7) % 5) - 2) * 0.55 + "deg");
  el.style.setProperty("--tint", c.tint);

  const face = (side, text, lang) => `
    <div class="face ${side}">
      <span class="num">${i + 1}</span>
      <div class="icon">${icons[c.icon]}</div>
      <div class="txt${c.small ? " small" : ""}">${text}</div>
      <span class="lang">${lang}</span>
    </div>`;

  el.innerHTML = `<div class="inner">${face("front", c.ru, "RU")}${face("back", c.en, "EN")}</div>`;

  const flip = () => {
    const on = el.classList.toggle("flipped");
    el.setAttribute("aria-pressed", on ? "true" : "false");
  };
  el.addEventListener("click", flip);
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
  });
  grid.appendChild(el);
});

document.getElementById("flipAll").addEventListener("click", () => {
  const all = [...document.querySelectorAll(".card")];
  const anyNotFlipped = all.some(c => !c.classList.contains("flipped"));
  all.forEach(c => {
    c.classList.toggle("flipped", anyNotFlipped);
    c.setAttribute("aria-pressed", anyNotFlipped ? "true" : "false");
  });
});
</script>
</body>
</html>
